<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piece & Petal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-[#FAF8F5] text-stone-800 pb-28 antialiased selection:bg-stone-200">

  <!-- Header -->
  <header class="sticky top-0 z-30 bg-[#FAF8F5]/90 backdrop-blur-md px-5 py-4 border-b border-stone-200/60 flex items-center justify-between">
    <div>
      <h1 class="text-lg font-bold tracking-tight text-stone-900">Piece & Petal</h1>
      <p class="text-[11px] font-medium text-stone-500 uppercase tracking-wider">Tokyo Sourcing • Drop 01</p>
    </div>
    <span class="inline-flex items-center px-2.5 py-1 rounded-full text-[10px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
      100% Tokyo Authentic
    </span>
  </header>

  <!-- Dynamic Categories Horizontal Bar -->
  <div class="sticky top-[69px] z-20 bg-[#FAF8F5]/90 backdrop-blur-md px-5 py-3 border-b border-stone-100">
    <div id="category-bar" class="flex space-x-2 overflow-x-auto hide-scrollbar">
      <!-- Generated dynamically -->
    </div>
  </div>

  <!-- Product Grid -->
  <main class="p-5">
    <div id="product-grid" class="grid grid-cols-2 gap-4">
      <div class="col-span-2 text-center py-12 text-xs text-stone-400">Loading catalog...</div>
    </div>
  </main>

  <!-- Sticky Bottom Cart Bar -->
  <div id="cart-bar" class="fixed bottom-4 inset-x-4 max-w-md mx-auto hidden z-40">
    <button onclick="openCheckout()" class="w-full bg-stone-900 text-white p-4 rounded-2xl shadow-xl flex items-center justify-between font-medium active:scale-[0.98] transition">
      <div class="flex items-center space-x-2">
        <span id="cart-count-badge" class="bg-stone-700 text-[11px] px-2 py-0.5 rounded-full font-semibold">0</span>
        <span class="text-sm font-semibold">View Selected Items</span>
      </div>
      <span id="cart-total-display" class="text-sm font-semibold">$0.00</span>
    </button>
  </div>

  <!-- Checkout Drawer -->
  <div id="checkout-modal" class="fixed inset-0 z-50 bg-black/40 backdrop-blur-sm hidden flex items-end">
    <div class="bg-white w-full rounded-t-3xl max-h-[88vh] overflow-y-auto p-6 space-y-5">
      <div class="flex justify-between items-center pb-2 border-b border-stone-100">
        <h2 class="text-base font-semibold text-stone-900">Checkout Summary</h2>
        <button onclick="closeCheckout()" class="text-stone-400 hover:text-stone-600 text-sm font-medium">Close</button>
      </div>

      <div id="order-items-list" class="divide-y divide-stone-100 text-sm"></div>

      <div class="space-y-3 pt-2">
        <div>
          <label class="text-[11px] font-medium text-stone-500 uppercase">Your Name</label>
          <input type="text" id="cust-name" placeholder="Name" class="w-full mt-1 p-3 border border-stone-200 rounded-xl text-sm outline-none focus:border-stone-800">
        </div>
        <div>
          <label class="text-[11px] font-medium text-stone-500 uppercase">Phone Number</label>
          <input type="tel" id="cust-phone" placeholder="012 345 678" class="w-full mt-1 p-3 border border-stone-200 rounded-xl text-sm outline-none focus:border-stone-800">
        </div>
        <div>
          <label class="text-[11px] font-medium text-stone-500 uppercase">Delivery Location</label>
          <input type="text" id="cust-address" placeholder="Phnom Penh address or Province" class="w-full mt-1 p-3 border border-stone-200 rounded-xl text-sm outline-none focus:border-stone-800">
        </div>
      </div>

      <!-- KHQR Local Image -->
      <div class="p-4 bg-stone-50 rounded-2xl border border-stone-200/80 text-center space-y-2">
        <p class="text-xs font-semibold uppercase tracking-wider text-stone-500">Scan via ABA / Any KHQR App</p>
        <div class="w-48 h-48 mx-auto bg-white p-2 rounded-xl shadow-sm border border-stone-200 flex items-center justify-center overflow-hidden">
          <img src="/static/khqr.png" alt="Piece & Petal KHQR" class="w-full h-full object-contain" onerror="this.parentElement.innerHTML='<span class=\'text-xs text-stone-400\'>Add khqr.png to templates/</span>'">
        </div>
        <p class="text-[11px] text-stone-500">Account: <span class="font-medium text-stone-800">PIECE & PETAL</span></p>
      </div>

      <button onclick="submitOrder()" class="w-full bg-stone-900 text-white py-4 rounded-xl text-sm font-semibold active:scale-[0.98] transition">
        I Have Transferred • Place Order
      </button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let allProducts = [];
    let activeCategory = 'All';
    let cart = {};

    async function fetchCatalog() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        renderCategories();
        renderProducts();
      } catch (err) {
        console.error('Failed to load products', err);
        document.getElementById('product-grid').innerHTML = `
          <div class="col-span-2 text-center py-12 text-xs text-rose-500">Failed to load items. Pull down to refresh.</div>
        `;
      }
    }

    function renderCategories() {
      const categories = ['All', ...new Set(allProducts.map(p => p.category).filter(Boolean))];
      const catBar = document.getElementById('category-bar');

      catBar.innerHTML = categories.map(cat => {
        const isActive = cat === activeCategory;
        const classes = isActive
          ? 'bg-stone-900 text-white border-stone-900'
          : 'bg-white text-stone-600 border-stone-200 hover:bg-stone-50';

        return `
          <button onclick="setCategory('${cat}')" class="whitespace-nowrap px-4 py-1.5 rounded-full text-xs font-medium border transition ${classes}">
            ${cat}
          </button>
        `;
      }).join('');
    }

    function setCategory(cat) {
      activeCategory = cat;
      renderCategories();
      renderProducts();
    }

    function renderProducts() {
      const filtered = activeCategory === 'All' 
        ? allProducts 
        : allProducts.filter(p => p.category.toLowerCase() === activeCategory.toLowerCase());

      const grid = document.getElementById('product-grid');

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-2 text-center py-12 text-xs text-stone-400">No items under this category yet.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="bg-white rounded-2xl border border-stone-200/70 overflow-hidden flex flex-col justify-between shadow-sm">
          <div class="aspect-square w-full bg-stone-50 relative overflow-hidden">
            <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x400/faf8f5/stone?text=Piece+%26+Petal'">
            ${p.tag ? `<span class="absolute top-2 left-2 text-[9px] font-bold uppercase tracking-wider bg-white/90 backdrop-blur-sm px-2 py-0.5 rounded-md text-stone-800 shadow-sm">${p.tag}</span>` : ''}
          </div>
          <div class="p-3.5 space-y-2 flex-1 flex flex-col justify-between">
            <div>
              <p class="text-xs font-semibold text-stone-900 leading-snug line-clamp-2">${p.title}</p>
              <p class="text-xs font-bold text-stone-900 mt-1">$${Number(p.price).toFixed(2)}</p>
            </div>
            <button onclick="addToCart('${p.id}')" class="w-full py-2 bg-stone-50 hover:bg-stone-100 border border-stone-200 rounded-lg text-xs font-medium text-stone-800 active:scale-[0.97] transition">
              + Add to Bag
            </button>
          </div>
        </div>
      `).join('');
    }

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartBar();
    }

    function updateCartBar() {
      const totalItems = Object.values(cart).reduce((a, b) => a + b, 0);
      let totalPrice = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const prod = allProducts.find(p => p.id === id);
        if (prod) totalPrice += prod.price * qty;
      }

      const bar = document.getElementById('cart-bar');
      if (totalItems > 0) {
        bar.classList.remove('hidden');
        document.getElementById('cart-count-badge').innerText = `${totalItems} items`;
        document.getElementById('cart-total-display').innerText = `$${totalPrice.toFixed(2)}`;
      } else {
        bar.classList.add('hidden');
      }
    }

    function openCheckout() {
      const list = document.getElementById('order-items-list');
      let html = '';
      let total = 0;

      for (const [id, qty] of Object.entries(cart)) {
        const p = allProducts.find(prod => prod.id === id);
        if (p) {
          total += p.price * qty;
          html += `
            <div class="py-2.5 flex justify-between items-center">
              <div>
                <p class="font-medium text-stone-800">${p.title}</p>
                <p class="text-xs text-stone-500">${qty} × $${p.price.toFixed(2)}</p>
              </div>
              <span class="font-semibold text-stone-800">$${(p.price * qty).toFixed(2)}</span>
            </div>
          `;
        }
      }
      list.innerHTML = html;
      document.getElementById('checkout-modal').classList.remove('hidden');
    }

    function closeCheckout() {
      document.getElementById('checkout-modal').classList.add('hidden');
    }

    async function submitOrder() {
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      const address = document.getElementById('cust-address').value;

      if (!phone || !address) {
        alert('Please fill in your phone number and delivery address.');
        return;
      }

      let summaryList = [];
      let total = 0;
      for (const [id, qty] of Object.entries(cart)) {
        const p = allProducts.find(prod => prod.id === id);
        if (p) {
          total += p.price * qty;
          summaryList.push(`• ${qty}x ${p.title} ($${(p.price * qty).toFixed(2)})`);
        }
      }

      const payload = {
        user_id: tg?.initDataUnsafe?.user?.id || null,
        customer_name: name || tg?.initDataUnsafe?.user?.first_name || 'Customer',
        phone: phone,
        address: address,
        total: total,
        summary: summaryList.join('\n')
      };

      try {
        const res = await fetch('/api/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Order placed successfully! Our team will confirm payment in your chat.');
          cart = {};
          closeCheckout();
          updateCartBar();
          if (tg) tg.close();
        }
      } catch (e) {
        alert('Failed to place order. Please reach out to us directly in chat.');
      }
    }

    fetchCatalog();
  </script>
</body>
</html>
